name: Watchdog (домашний сервер autopost)

# Ежечасная проверка живости домашнего сервера. При подтверждённом отключении
# поднимается резервный сервер на Hetzner (Этап 4); при возвращении дома он
# гасится (Этап 5, ещё не подключён — пока удаляем вручную).
#
# Живёт в ОТДЕЛЬНОМ ПУБЛИЧНОМ репозитории → минуты Actions бесплатны/безлимитны,
# исходники autopost не раскрываются, а адрес дома лежит в секрете HOME_HEALTH_URL.

on:
  schedule:
    - cron: "5 * * * *"      # каждый час в :05 (UTC); GitHub может задержать на 5–15 мин
  workflow_dispatch:          # ручной запуск для теста
    inputs:
      retries:
        description: "Доп. попыток после первого провала"
        default: "3"
      retry_interval:
        description: "Пауза между попытками, сек"
        default: "600"
      force_provision:
        description: "Поднять резерв, не проверяя дом (тест)"
        type: boolean
        default: false
      dry_run:
        description: "Только показать выбранный тариф и цену, ничего не создавать"
        type: boolean
        default: false
      force_teardown:
        description: "Вернуться домой и погасить резерв, не проверяя дом (тест)"
        type: boolean
        default: false
      keep_server:
        description: "При гашении: всё проверить, но сервер не удалять"
        type: boolean
        default: false

concurrency:
  group: watchdog             # не запускать два сторожа одновременно
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 60       # 3 паузы по 10 мин + подъём резерва
    steps:
      - uses: actions/checkout@v4

      - name: Проверить домашний сервер
        id: check
        if: >-
          ${{ github.event.inputs.force_provision != 'true' &&
              github.event.inputs.force_teardown != 'true' }}
        env:
          HOME_HEALTH_URL: ${{ secrets.HOME_HEALTH_URL }}
          RETRIES: ${{ github.event.inputs.retries || '3' }}
          RETRY_INTERVAL: ${{ github.event.inputs.retry_interval || '600' }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash scripts/watchdog.sh

      - name: Состояние
        run: echo "home_state=${{ steps.check.outputs.home_state }}"

      # --- Этап 4: резерв на Hetzner ---
      # Предохранитель: подъём включается только когда в репозитории заведена
      # переменная FAILOVER_ENABLED=true (Settings → Variables). Пока её нет,
      # сторож работает как раньше — только детект и уведомление.
      - name: Поднять резерв на Hetzner
        id: provision
        if: >-
          ${{ vars.FAILOVER_ENABLED == 'true' &&
              (steps.check.outputs.home_state == 'HOME_DOWN' ||
               github.event.inputs.force_provision == 'true') }}
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          BACKUP_REPO: ${{ secrets.BACKUP_REPO }}
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
          BACKUP_BRANCH: ${{ vars.BACKUP_BRANCH || 'main' }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          API_KEY: ${{ secrets.API_KEY }}
          REMOTE_ACCESS_TOKEN: ${{ secrets.REMOTE_ACCESS_TOKEN }}
          SSH_KEY_NAME: ${{ vars.SSH_KEY_NAME }}
          SERVER_TYPE: ${{ vars.SERVER_TYPE }}
          LOCATIONS: ${{ vars.LOCATIONS || 'fsn1,nbg1,hel1' }}
          PORT: ${{ vars.PORT || '8778' }}
          TZ: ${{ vars.TZ || 'Europe/Prague' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash scripts/provision.sh

      # --- Этап 5: вернуться домой и погасить резерв ---
      # Быстрый выход, если резерва нет: скрипт сам это проверяет одним запросом.
      - name: Вернуться домой и погасить резерв
        id: teardown
        if: >-
          ${{ vars.FAILOVER_ENABLED == 'true' &&
              (steps.check.outputs.home_state == 'HOME_UP' ||
               github.event.inputs.force_teardown == 'true') }}
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          HOME_HEALTH_URL: ${{ secrets.HOME_HEALTH_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          BACKUP_REPO: ${{ secrets.BACKUP_REPO }}
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
          BACKUP_BRANCH: ${{ vars.BACKUP_BRANCH || 'main' }}
          PORT: ${{ vars.PORT || '8778' }}
          KEEP_SERVER: ${{ github.event.inputs.keep_server == 'true' && '1' || '0' }}
          SKIP_HOME_RESTORE: ${{ vars.SKIP_HOME_RESTORE || '0' }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash scripts/teardown.sh
